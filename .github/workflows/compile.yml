name: Build tdraw.dll (GG)

# GG fork: branches gg-* build the DLL as a workflow artifact (no release). Upstream's
# master/tag release flow is left to upstream; a GG release is published by hand from an artifact.
on:
  push:
    branches:
      - 'gg-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64_x86

    - name: Build tdraw.dll
      run: |
        msbuild src/DDraw/ddraw.vcxproj /p:Configuration=ReleasePublic /p:Platform=x86

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tdraw
        path: |
          src/DDraw/Public/tdraw.dll
          src/DDraw/Public/tdraw.pdb
        if-no-files-found: error
        retention-days: 14
